name: Notify Telegram about new pull requests

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "-1003792857775"
      TELEGRAM_REPLY_TO_MESSAGE_ID: "1"
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Post pull request link to Telegram
        run: |
          test -n "$TELEGRAM_BOT_TOKEN"
          message=$(printf 'New pull request\n\n%s #%s: %s\n%s\nAuthor: %s' \
            "$REPOSITORY" "$PR_NUMBER" "$PR_TITLE" "$PR_URL" "$PR_AUTHOR")
          curl --fail-with-body --silent --show-error \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "reply_to_message_id=${TELEGRAM_REPLY_TO_MESSAGE_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true"
